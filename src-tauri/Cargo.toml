[package]
name = "ultiunwrapper"
version = "0.1.0"
description = "Instrumented UV unwrapping studio with per-stage diagnostics"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ultiunwrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
