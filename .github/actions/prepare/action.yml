# Prep shared by every build job: Node 24 with npm cache, dependency install,
# and the build-version stamping that both the topbar badge and the installer
# versioning depend on. Callers must run actions/checkout (fetch-depth: 0)
# first: the build number derives from full git history.
name: Prepare UltiUnwrapper build
description: >-
  Set up Node 24 with npm cache, install dependencies, and stamp the build
  version env vars (VITE_BUILD_VERSION / VITE_COMMIT_SHA). With
  tauri-version: true, also writes src-tauri/tauri.version.json from the same
  git build count.
inputs:
  tauri-version:
    description: >-
      When 'true', also run scripts/write-tauri-version.mjs so the installer
      version derives from the same git build count as the badge.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Set build version
      shell: bash
      run: |
        echo "VITE_BUILD_VERSION=$(node scripts/build-version.mjs)" >> "$GITHUB_ENV"
        echo "VITE_COMMIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

    - name: Write Tauri version
      if: inputs.tauri-version == 'true'
      shell: bash
      run: node scripts/write-tauri-version.mjs
