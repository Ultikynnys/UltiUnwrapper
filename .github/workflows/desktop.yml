name: Build desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies and stamp build version
        uses: ./.github/actions/prepare
        with:
          tauri-version: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Test
        run: npm test
      - name: Build and package (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.version.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "version=$(node scripts/build-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          INSTALLERS=()
          while IFS= read -r -d '' FILE; do
            INSTALLERS+=("$FILE")
          done < <(find release -type f -print0)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${INSTALLERS[@]}" --clobber
          else
            gh release create "$TAG" "${INSTALLERS[@]}" \
              --title "UltiUnwrapper $TAG" \
              --notes "UltiUnwrapper desktop build (Windows .msi/.exe, Linux .AppImage/.deb). All processing stays on-device."
          fi
